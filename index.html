<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Calendar Generator — v1.4.0</title>
  <!--
    ============================================================
    CALENDAR GENERATOR
    Version:  1.5.0
    Released: 2026-05-21
      Patch:    1.4.1 — Fix circular dependency (EventManager/DatePicker);
               move draft state out of EventManager into DatePicker;
               fix module initialisation order.
    Target:   Chrome desktop + mobile browsers

    CHANGELOG:
      1.4.0 — Mini calendar date picker for event selection;
               default photo zoom = cover (fills frame, no gaps);
               pan by dragging directly on preview;
               responsive mobile layout (bottom drawer, scaled preview,
               touch-friendly controls).
      1.3.0 — Multi-day events; click-to-upload on preview;
               Google Photos hidden; built-in UK holidays;
               @page print preset; pre-print checklist modal.
      1.2.0 — Print fix; default photo fit; Show Today off.
      1.1.0 — Branding; dark/light theme; pan/zoom; quality warnings.
      1.0.0 — Initial release.

    MODULES:
      CONFIG, Security, CalendarEngine, EventManager,
      HolidayLoader, UKHolidays, PhotoManager, FontManager,
      BrandingManager, GooglePhotosStub, QualityChecker,
      DatePicker, ImportExport, PrintHandler, Toast,
      PanZoom, UIRenderer, MobileUI, App
    ============================================================
  -->
  <style>
    @page { size: A4 portrait; margin: 0; }

    /* ============================================================
       THEME VARIABLES
    ============================================================ */
    :root {
      --bg:         #0f0f0f;
      --surface:    #1a1a1a;
      --surface2:   #242424;
      --border:     #333;
      --accent:     #c8a96e;
      --accent2:    #e8c98e;
      --text:       #e8e4dc;
      --text-muted: #888;
      --danger:     #c0392b;
      --success:    #27ae60;
      --warning:    #e67e22;
      --radius:     6px;
      --shadow:     0 4px 24px rgba(0,0,0,0.5);
      --font-ui:    'Georgia','Times New Roman',serif;
      --font-cal:   'Georgia','Times New Roman',serif;
      --drawer-h:   420px;
    }
    [data-theme="light"] {
      --bg:         #f0ece4;
      --surface:    #ffffff;
      --surface2:   #f5f1eb;
      --border:     #d0c8bc;
      --accent:     #8b6914;
      --accent2:    #a07820;
      --text:       #1a1a1a;
      --text-muted: #666;
      --shadow:     0 4px 24px rgba(0,0,0,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-ui); min-height: 100vh;
      display: flex; flex-direction: column;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 11px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; flex-wrap: wrap;
      transition: background 0.3s; flex-shrink: 0;
    }
    .branding { display: flex; align-items: center; gap: 10px; }
    #brandLogo { height: 34px; width: auto; object-fit: contain; display: none; border-radius: 3px; }
    #brandLogo.visible { display: block; }
    .brand-text { display: flex; flex-direction: column; }
    #brandTitle {
      font-size: 1.15rem; letter-spacing: 0.1em; color: var(--accent);
      text-transform: uppercase; font-weight: normal; cursor: pointer;
      border-bottom: 1px dashed transparent; transition: border-color 0.2s;
    }
    #brandTitle:hover { border-bottom-color: var(--accent); }
    .brand-sub { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 1px; }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .theme-toggle {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 10px; cursor: pointer;
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 5px; transition: all 0.2s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .btn-print {
      background: var(--accent); border: 2px solid var(--accent);
      color: #111; padding: 7px 16px; border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 0.82rem; font-weight: bold;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-print:hover { background: var(--accent2); border-color: var(--accent2); }

    /* ============================================================
       TOOLBAR
    ============================================================ */
    .toolbar {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      padding: 8px 20px; display: flex; flex-wrap: wrap;
      gap: 8px; align-items: center; transition: background 0.3s; flex-shrink: 0;
    }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .toolbar-group + .toolbar-group { border-left: 1px solid var(--border); padding-left: 8px; }
    .lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); white-space: nowrap; }
    .range-indicator {
      font-size: 0.74rem; color: var(--accent); letter-spacing: 0.03em;
      padding: 3px 8px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); white-space: nowrap;
    }

    select, input[type="number"], input[type="text"] {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 4px 7px; border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 0.78rem;
      outline: none; transition: border-color 0.2s, background 0.3s;
    }
    select:focus, input:focus { border-color: var(--accent); }

    button {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 5px 11px; border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 0.76rem;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    button:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: bold; }
    button.primary:hover { background: var(--accent2); border-color: var(--accent2); color: #111; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover { background: var(--danger); color: #fff; }
    button.uk-btn { border-color: #1d4289; color: #4a80d4; }
    button.uk-btn:hover { background: #1d4289; color: #fff; }

    /* ============================================================
       MAIN LAYOUT
    ============================================================ */
    main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* ============================================================
       SIDEBAR (desktop)
    ============================================================ */
    .sidebar {
      width: 280px; min-width: 240px; background: var(--surface);
      border-right: 1px solid var(--border); display: flex;
      flex-direction: column; overflow: hidden; transition: background 0.3s;
      flex-shrink: 0;
    }
    .sidebar-inner { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-section { border-bottom: 1px solid var(--border); padding: 12px; flex-shrink: 0; }
    .sidebar-section h3 {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--accent); margin-bottom: 8px; font-weight: normal;
    }
    .month-list { display: flex; flex-direction: column; gap: 3px; }
    .month-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: var(--radius); cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s; font-size: 0.78rem;
    }
    .month-item:hover { background: var(--surface2); border-color: var(--border); }
    .month-item.active { border-color: var(--accent); background: var(--surface2); color: var(--accent); }
    .month-item .photo-dot { font-size: 0.6rem; color: var(--success); }

    .month-editor { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .month-editor h3 { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: normal; }

    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-group > label { font-size: 0.65rem; color: var(--text-muted); }

    textarea {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 6px; border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 0.76rem;
      resize: vertical; outline: none; min-height: 46px; transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }

    .template-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; }
    .template-option {
      border: 2px solid var(--border); border-radius: var(--radius);
      padding: 4px; cursor: pointer; transition: all 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
    }
    .template-option:hover { border-color: var(--accent); }
    .template-option.selected { border-color: var(--accent); background: rgba(200,169,110,0.1); }
    .template-option .t-icon  { font-size: 0.9rem; }
    .template-option .t-label { font-size: 0.55rem; color: var(--text-muted); line-height: 1.2; }

    .photo-slot {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 8px; transition: border-color 0.2s;
      font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px;
    }
    .photo-slot.has-image { border-style: solid; border-color: var(--success); }
    .photo-slot.clickable { cursor: pointer; }
    .photo-slot.clickable:hover { border-color: var(--accent); }
    .photo-slot input[type="file"] { display: none; }

    .thumb-wrap {
      width: 100%; height: 64px; overflow: hidden; position: relative;
      border-radius: 3px; background: var(--surface2); cursor: grab; margin-bottom: 4px;
    }
    .thumb-wrap:active { cursor: grabbing; }
    .thumb-wrap img { position: absolute; top:0; left:0; transform-origin: top left; pointer-events: none; max-width: none; }

    .slot-controls { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 3px; }
    .slot-controls button { padding: 2px 6px; font-size: 0.58rem; }

    .quality-warn { font-size: 0.6rem; padding: 3px 5px; border-radius: 3px; margin-top: 3px; display: none; }
    .quality-warn.warn-amber { background: rgba(230,126,34,0.15); color: var(--warning); border: 1px solid rgba(230,126,34,0.3); display: block; }
    .quality-warn.warn-red   { background: rgba(192,57,43,0.15);  color: var(--danger);  border: 1px solid rgba(192,57,43,0.3);  display: block; }

    /* ---- Events ---- */
    .event-item {
      display: flex; align-items: flex-start; gap: 5px;
      padding: 5px 6px; background: var(--surface2); border-radius: var(--radius);
      font-size: 0.7rem; border: 1px solid var(--border); margin-bottom: 3px;
    }
    .event-item .ev-info { flex: 1; }
    .event-item .ev-date { color: var(--accent); font-size: 0.62rem; }
    .event-item button { padding: 2px 5px; font-size: 0.58rem; }

    /* ---- Add event form ---- */
    .add-event-form { display: flex; flex-direction: column; gap: 6px; }
    .add-event-form input[type="text"] { width: 100%; }
    .date-range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .date-field { display: flex; flex-direction: column; gap: 2px; }
    .date-field label { font-size: 0.6rem; color: var(--text-muted); }
    .date-field-input {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 5px 7px; border-radius: var(--radius);
      font-family: var(--font-ui); font-size: 0.76rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 4px; min-height: 28px; transition: border-color 0.2s;
      user-select: none;
    }
    .date-field-input:hover { border-color: var(--accent); }
    .date-field-input.has-date { color: var(--text); }
    .date-field-input.empty { color: var(--text-muted); font-style: italic; font-size: 0.7rem; }
    .date-field-input .cal-icon { font-size: 0.8rem; opacity: 0.6; }
    .checkbox-row { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; }
    .checkbox-row input[type="checkbox"] { accent-color: var(--accent); }

    /* ============================================================
       DATE PICKER POPUP CALENDAR
    ============================================================ */
    .datepicker-backdrop {
      position: fixed; inset: 0; z-index: 3000;
      background: transparent;
    }
    .datepicker-popup {
      position: fixed; z-index: 3001;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 12px; min-width: 240px;
      animation: dpIn 0.15s ease;
    }
    @keyframes dpIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }

    .dp-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .dp-header button {
      padding: 3px 8px; font-size: 0.7rem; border-radius: var(--radius);
      background: var(--surface2);
    }
    .dp-month-label { font-size: 0.82rem; color: var(--accent); letter-spacing: 0.05em; }

    .dp-dow-row {
      display: grid; grid-template-columns: repeat(7,1fr);
      margin-bottom: 3px;
    }
    .dp-dow-cell {
      text-align: center; font-size: 0.58rem; color: var(--text-muted);
      padding: 2px 0; text-transform: uppercase; letter-spacing: 0.06em;
    }

    .dp-days-grid {
      display: grid; grid-template-columns: repeat(7,1fr); gap: 2px;
    }
    .dp-day {
      text-align: center; font-size: 0.7rem; padding: 5px 2px;
      border-radius: 3px; cursor: pointer; transition: all 0.1s;
      color: var(--text); border: 1px solid transparent;
    }
    .dp-day:hover { background: var(--surface2); border-color: var(--border); }
    .dp-day.empty { cursor: default; }
    .dp-day.today { border-color: var(--border); color: var(--accent); }
    .dp-day.selected-start, .dp-day.selected-end {
      background: var(--accent); color: #111; font-weight: bold; border-color: var(--accent);
    }
    .dp-day.in-range {
      background: rgba(200,169,110,0.2); border-color: rgba(200,169,110,0.3);
    }
    .dp-day.other-month { color: var(--text-muted); opacity: 0.4; }

    .dp-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
      font-size: 0.65rem; color: var(--text-muted);
    }
    .dp-footer button { padding: 3px 8px; font-size: 0.65rem; }

    /* ============================================================
       PREVIEW AREA
    ============================================================ */
    .preview-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 24px; background: var(--bg);
      display: flex; flex-direction: column; gap: 32px; align-items: center;
      transition: background 0.3s;
    }

    /* ============================================================
       CALENDAR PAGE — Fixed A4 (794×1123px at 96dpi)
       Photo: 480px | Caption: 32px | Grid: 611px = 1123px
    ============================================================ */
    .cal-page {
      background: #fff; color: #111;
      width: 794px; height: 1123px;
      position: relative; overflow: hidden;
      box-shadow: var(--shadow); border-radius: 2px;
      page-break-after: always; break-after: page;
      flex-shrink: 0;
    }
    .cal-photo-area {
      position: absolute; top:0; left:0; right:0; height: 480px;
      background: #ddd; overflow: hidden;
    }
    .cal-caption {
      position: absolute; top:480px; left:0; right:0; height:32px;
      padding: 0 24px; display: flex; align-items: center; justify-content: center;
      font-size: 0.76rem; font-style: italic; color: #666;
      background: #f9f7f3; border-top: 1px solid #e0dbd0; border-bottom: 1px solid #e0dbd0;
      overflow: hidden;
    }
    .cal-grid-area {
      position: absolute; top:512px; left:0; right:0; bottom:0;
      padding: 13px 20px 14px; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Photo templates */
    .cal-photo-area.tmpl-single .pz-container { position:absolute; inset:0; }
    .cal-photo-area.tmpl-1plus2 .pz-container:nth-child(1) { position:absolute; top:0; left:0; width:66.66%; height:100%; }
    .cal-photo-area.tmpl-1plus2 .pz-container:nth-child(2) { position:absolute; top:0; left:66.66%; width:33.34%; height:50%; border-left:3px solid #fff; }
    .cal-photo-area.tmpl-1plus2 .pz-container:nth-child(3) { position:absolute; top:50%; left:66.66%; width:33.34%; height:50%; border-left:3px solid #fff; border-top:2px solid #fff; }
    .cal-photo-area.tmpl-1plus3 .pz-container:nth-child(1) { position:absolute; top:0; left:0; width:66.66%; height:100%; }
    .cal-photo-area.tmpl-1plus3 .pz-container:nth-child(2) { position:absolute; top:0; left:66.66%; width:33.34%; height:33.33%; border-left:3px solid #fff; }
    .cal-photo-area.tmpl-1plus3 .pz-container:nth-child(3) { position:absolute; top:33.33%; left:66.66%; width:33.34%; height:33.33%; border-left:3px solid #fff; border-top:2px solid #fff; }
    .cal-photo-area.tmpl-1plus3 .pz-container:nth-child(4) { position:absolute; top:66.66%; left:66.66%; width:33.34%; height:33.34%; border-left:3px solid #fff; border-top:2px solid #fff; }

    /* Pan/zoom container.
       Default: locked (cursor:default, no drag on preview).
       .pz-unlocked added by JS when user enables pan editing. */
    .pz-container {
      overflow: hidden;
      cursor: default;
      position: relative;
    }
    .pz-container.pz-unlocked { cursor: grab; }
    .pz-container.pz-unlocked:active { cursor: grabbing; }
    .pz-container img {
      position: absolute; top:0; left:0;
      transform-origin: top left; pointer-events: none;
      image-rendering: high-quality; max-width: none;
    }

    /* Pan-lock toggle button shown in sidebar next to each photo slot */
    .pan-lock-btn {
      font-size: 0.6rem; padding: 2px 7px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .pan-lock-btn:hover { border-color: var(--accent); color: var(--accent); }
    .pan-lock-btn.unlocked {
      border-color: var(--warning); color: var(--warning);
      background: rgba(230,126,34,0.08);
    }

    /* Compact grid: empty trailing rows suppressed */
    .cal-row-hidden { display: contents; }
    .cal-row-hidden .cal-date-cell {
      display: none !important;
    }

    /* Clickable placeholder */
    .photo-placeholder {
      position: absolute; inset:0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #e8e4dc; color: #bbb; gap: 5px;
      cursor: pointer; transition: background 0.2s;
    }
    .photo-placeholder:hover { background: #ddd9d0; }
    .photo-placeholder .ph-icon { font-size: 2rem; opacity: 0.4; transition: opacity 0.2s; }
    .photo-placeholder:hover .ph-icon { opacity: 0.7; }
    .photo-placeholder span { font-size: 0.7rem; font-style: italic; letter-spacing: 0.04em; }
    .photo-placeholder .ph-hint { font-size: 0.6rem; color: #aaa; margin-top: 1px; }

    /* Calendar grid */
    .cal-month-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; flex-shrink:0; }
    .cal-month-name { font-size:1.75rem; letter-spacing:0.07em; text-transform:uppercase; font-weight:normal; color:#111; }
    .cal-year-label { font-size:0.9rem; color:#999; letter-spacing:0.08em; }
    .cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:3px; flex-shrink:0; }
    .cal-dow-cell { text-align:center; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.1em; color:#999; padding:3px 0; border-bottom:1px solid #ddd; }
    .cal-dates-grid { display:grid; grid-template-columns:repeat(7,1fr); flex:1; border-left:1px solid #e8e4dc; border-top:1px solid #e8e4dc; min-height:0; }
    .cal-date-cell { border-right:1px solid #e8e4dc; border-bottom:1px solid #e8e4dc; padding:2px 3px; font-size:0.7rem; overflow:hidden; }
    .cal-date-cell.empty { background:#fafafa; }
    .cal-date-num { font-size:0.66rem; color:#333; display:inline-block; margin-bottom:1px; }
    .cal-date-cell.today .cal-date-num { background:#1a1a1a; color:#fff; border-radius:50%; width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; font-size:0.6rem; }
    .cal-event { font-size:0.52rem; line-height:1.3; padding:1px 2px; border-radius:2px; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
    .cal-event.holiday { background:#1d4289; color:#fff; }
    .cal-event.special { background:#7d5a0a; color:#fff; }
    .cal-event.special-range { background:#9c7320; color:#fff; }

    /* ============================================================
       MOBILE LAYOUT (≤768px)
       Full-screen preview, bottom drawer for controls.
    ============================================================ */
    @media (max-width: 768px) {

      /* Header: tighter, no action buttons (moved to drawer) */
      header { padding: 10px 14px; }
      .header-desktop { display: none !important; }
      .brand-sub { display: none; }

      /* Toolbar: hide on mobile (moved to drawer) */
      .toolbar { display: none !important; }

      /* Sidebar: hide on mobile (replaced by drawer) */
      .sidebar { display: none !important; }

      /* Main: full width */
      main { flex-direction: column; overflow: visible; }

      /* Preview: full width, allow scroll, extra bottom padding for drawer tab */
      .preview-area {
        padding: 12px 8px 80px;
        align-items: center;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* Scale calendar page to fit mobile screen.
         794px → ~374px on a 390px phone = scale 0.47 */
      .cal-page-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }

      .cal-page {
        transform-origin: top center;
        /* JS sets the scale dynamically via MobileUI.scalePages() */
        box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      }
    }

    /* ============================================================
       BOTTOM DRAWER (mobile only)
    ============================================================ */
    .drawer-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,0.5);
    }
    .drawer-backdrop.open { display: block; }

    .drawer {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 901;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      height: var(--drawer-h);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.06,0.64,1);
      flex-direction: column;
      overflow: hidden;
    }
    .drawer.open { transform: translateY(0); }

    /* Drawer tab — always visible at bottom of screen on mobile */
    .drawer-tab {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 902;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 20px; align-items: center; justify-content: space-between;
      gap: 10px;
    }
    .drawer-tab .tab-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 8px;
    }

    .drawer-inner { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    .drawer-section { display: flex; flex-direction: column; gap: 6px; }
    .drawer-section h4 { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: normal; }

    .mobile-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .mobile-row .lbl { font-size: 0.65rem; color: var(--text-muted); }
    .mobile-row select { flex: 1; min-width: 80px; font-size: 0.8rem; padding: 6px 8px; }
    .mobile-row button { flex-shrink: 0; padding: 7px 12px; font-size: 0.78rem; }

    .mobile-month-list { display: flex; flex-direction: column; gap: 3px; max-height: 120px; overflow-y: auto; }
    .mobile-month-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 9px; border-radius: var(--radius); cursor: pointer;
      border: 1px solid var(--border); font-size: 0.8rem;
      background: var(--surface2); transition: all 0.15s;
    }
    .mobile-month-item.active { border-color: var(--accent); color: var(--accent); }
    .mobile-month-item .photo-dot { color: var(--success); font-size: 0.65rem; }

    /* Show drawer elements only on mobile */
    @media (max-width: 768px) {
      .drawer { display: flex; }
      .drawer-tab { display: flex; flex-direction: column; padding: 6px 20px 10px; }
      .drawer-backdrop { display: none; } /* shown via JS when open */
    }

    /* ============================================================
       TOAST & MODAL
    ============================================================ */
    .toast-container { position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:5px; z-index:9999; pointer-events:none; }
    .toast { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); padding:8px 12px; border-radius:var(--radius); font-size:0.76rem; max-width:280px; animation:toastIn 0.2s ease; pointer-events:all; color:var(--text); }
    .toast.error   { border-left-color:var(--danger); }
    .toast.success { border-left-color:var(--success); }
    .toast.warn    { border-left-color:var(--warning); }
    @keyframes toastIn { from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;} }

    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:2000; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; max-width:420px; width:90%; box-shadow:var(--shadow); color:var(--text); }
    .modal h2 { font-size:0.92rem; font-weight:normal; color:var(--accent); margin-bottom:10px; letter-spacing:0.04em; }
    .modal p  { font-size:0.78rem; color:var(--text-muted); line-height:1.6; margin-bottom:10px; }
    .modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }

    .print-checklist { list-style:none; margin:8px 0; display:flex; flex-direction:column; gap:6px; }
    .print-checklist li { display:flex; align-items:flex-start; gap:8px; font-size:0.78rem; padding:6px 9px; background:var(--surface2); border-radius:var(--radius); border:1px solid var(--border); line-height:1.4; }
    .print-checklist .ck-icon { font-size:0.95rem; flex-shrink:0; margin-top:1px; }
    .print-checklist .ck-auto   { color:var(--success); }
    .print-checklist .ck-manual { color:var(--warning); }
    .print-checklist strong { display:block; font-size:0.76rem; color:var(--text); }
    .print-checklist span { font-size:0.7rem; color:var(--text-muted); }

    /* ---- Utilities ---- */
    .hidden { display:none !important; }
    .flex-gap { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .w100 { width:100%; }
    .mt8  { margin-top:8px; }
    .text-muted { color:var(--text-muted); font-size:0.72rem; }

    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); }

    /* ============================================================
       PRINT
    ============================================================ */
    @media print {
      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
      body { background:#fff !important; margin:0; padding:0; }
      header,.toolbar,.sidebar,.toast-container,.modal-backdrop,
      .drawer,.drawer-tab,.drawer-backdrop,.no-print { display:none !important; }
      main { display:block; margin:0; padding:0; }
      .preview-area { padding:0; display:block; overflow:visible; background:#fff; gap:0; }
      .cal-page-wrapper { display:block; width:100%; }
      .cal-page { transform:none !important; width:210mm; height:297mm; box-shadow:none; border-radius:0; margin:0; padding:0; page-break-after:always; break-after:page; overflow:hidden; }
      .cal-photo-area { height:126mm !important; }
      .cal-caption    { top:126mm !important; height:9mm !important; }
      .cal-grid-area  { top:135mm !important; }
      .photo-placeholder { background:#f5f5f5 !important; cursor:default; }
      .photo-placeholder .ph-icon,.photo-placeholder span,.photo-placeholder .ph-hint { display:none; }
      .pz-container { cursor:default !important; }
    }
  </style>

<script>
'use strict';

/* ============================================================
   MODULE 1: CONFIG
============================================================ */
const CONFIG = {
  version:'1.5.0', yearMin:2020, yearMax:2035,
  defaultYear:new Date().getFullYear(), defaultMonth:new Date().getMonth(),
  defaultCount:1, dbName:'CalendarGeneratorDB', dbVersion:2, dbStore:'photos',
  maxCaptionLen:200, maxEventLen:60, printDPI:300, printWarnDPI:200,
  slotPrintMM:{ main:{w:210,h:148}, side:{w:70,h:74} },
  templates:[
    {id:'single',label:'Full',   icon:'▣',    slotCount:1},
    {id:'1plus2',label:'1 + 2',  icon:'▣▪▪',  slotCount:3},
    {id:'1plus3',label:'1 + 3',  icon:'▣▫▫▫', slotCount:4},
  ],
  daysOfWeek:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
  monthNames:['January','February','March','April','May','June',
              'July','August','September','October','November','December'],
};

/* ============================================================
   MODULE 2: SECURITY
============================================================ */
const Security = (() => {
  const sanitiseText = str => typeof str!=='string'?'':str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;').replace(/\//g,'&#x2F;').slice(0,500);
  function validateSchema(obj,schema){for(const k of Object.keys(schema)){if(schema[k]==='optional')continue;const v=obj[k];if(v===undefined||v===null)throw new Error('Missing: '+k);if(schema[k]==='array'&&!Array.isArray(v))throw new Error('Expected array: '+k);if(schema[k]!=='array'&&typeof v!==schema[k])throw new Error('Expected '+schema[k]+': '+k);}}
  const isValidDate = s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s));
  const isValidYear = y=>Number.isInteger(y)&&y>=CONFIG.yearMin&&y<=CONFIG.yearMax;
  return {sanitiseText,validateSchema,isValidDate,isValidYear};
})();

/* ============================================================
   MODULE 3: CalendarEngine
============================================================ */
const CalendarEngine = (() => {
  function getMonthGrid(year,month){const fd=new Date(year,month,1).getDay(),offset=fd===0?6:fd-1,days=new Date(year,month+1,0).getDate(),cells=new Array(42).fill(0);for(let d=1;d<=days;d++)cells[offset+d-1]=d;return cells;}
  function getTodayDay(year,month){const n=new Date();return(n.getFullYear()===year&&n.getMonth()===month)?n.getDate():null;}
  function buildRange(sy,sm,count){const r=[];let y=sy,m=sm;for(let i=0;i<Math.min(count,12);i++){r.push({year:y,month:m});m++;if(m>11){m=0;y++;}}return r;}
  function rangeLabel(range){if(!range.length)return'';const f=r=>CONFIG.monthNames[r.month].slice(0,3)+' '+r.year;return range.length===1?f(range[0]):f(range[0])+' → '+f(range[range.length-1]);}
  return {getMonthGrid,getTodayDay,buildRange,rangeLabel};
})();

/* ============================================================
   MODULE 4: DatePicker
   Mini calendar popup for selecting start/end event dates.
   Draft state lives HERE — no dependency on EventManager.
   EventManager calls DatePicker.getDraftStart/End() when adding.
============================================================ */
const DatePicker = (() => {
  let mode      = 'start';
  let viewYear  = new Date().getFullYear();
  let viewMonth = new Date().getMonth();
  let backdropEl = null, popupEl = null;

  /* Draft state owned by DatePicker — no circular reference */
  let draftStart = '';
  let draftEnd   = '';

  const getDraftStart = () => draftStart;
  const getDraftEnd   = () => draftEnd;

  function open(which) {
    mode = which;
    const anchor = document.getElementById(which==='start'?'startDateDisplay':'endDateDisplay');
    const rect   = anchor ? anchor.getBoundingClientRect() : {bottom:200,left:20};

    // Navigate popup to the relevant month if date already set
    const existing = which==='start' ? draftStart : draftEnd;
    if (existing) { const d=new Date(existing); viewYear=d.getFullYear(); viewMonth=d.getMonth(); }

    close();

    backdropEl = document.createElement('div');
    backdropEl.className = 'datepicker-backdrop';
    backdropEl.onclick = close;
    document.body.appendChild(backdropEl);

    popupEl = document.createElement('div');
    popupEl.className = 'datepicker-popup';
    document.body.appendChild(popupEl);
    renderPopup();

    const popH = 300;
    let top = rect.bottom + 4;
    if (top + popH > window.innerHeight) top = Math.max(8, rect.top - popH - 4);
    const left = Math.max(8, Math.min(rect.left, window.innerWidth - 252));
    popupEl.style.top  = top  + 'px';
    popupEl.style.left = left + 'px';
  }

  function close() {
    if (backdropEl) { backdropEl.remove(); backdropEl = null; }
    if (popupEl)    { popupEl.remove();    popupEl    = null; }
  }

  function renderPopup() {
    if (!popupEl) return;
    const todayStr = new Date().toISOString().slice(0,10);
    const cells    = CalendarEngine.getMonthGrid(viewYear, viewMonth);
    const pad      = n => String(n).padStart(2,'0');

    let html = `
      <div class="dp-header">
        <button onclick="DatePicker._prev()">◀</button>
        <div class="dp-month-label">${CONFIG.monthNames[viewMonth]} ${viewYear}</div>
        <button onclick="DatePicker._next()">▶</button>
      </div>
      <div class="dp-dow-row">
        ${CONFIG.daysOfWeek.map(d=>`<div class="dp-dow-cell">${d[0]}</div>`).join('')}
      </div>
      <div class="dp-days-grid">`;

    cells.forEach(day => {
      if (day === 0) { html += `<div class="dp-day empty"></div>`; return; }
      const ds  = `${viewYear}-${pad(viewMonth+1)}-${pad(day)}`;
      let   cls = 'dp-day';
      if (ds === todayStr)  cls += ' today';
      if (ds === draftStart) cls += ' selected-start';
      if (ds === draftEnd)   cls += ' selected-end';
      if (draftStart && draftEnd && ds > draftStart && ds < draftEnd) cls += ' in-range';
      html += `<div class="${cls}" onclick="DatePicker._select('${ds}')">${day}</div>`;
    });

    html += `</div>
      <div class="dp-footer">
        <span>${mode==='start'?'Pick start date':'Pick end date (optional)'}</span>
        <div style="display:flex;gap:5px;">
          ${mode==='end'?`<button onclick="DatePicker._clearEnd()">Clear end</button>`:''}
          <button onclick="DatePicker.close()">Done</button>
        </div>
      </div>`;

    popupEl.innerHTML = html;
  }

  function _select(ds) {
    if (mode === 'start') {
      draftStart = ds;
      if (draftEnd && draftEnd < ds) draftEnd = '';
      updateDisplays();
      mode = 'end'; // auto-advance to end selection
      renderPopup();
    } else {
      if (ds < draftStart) { Toast.show('End date must be after start.','error'); return; }
      draftEnd = ds;
      updateDisplays();
      renderPopup();
    }
  }

  function _clearEnd() { draftEnd = ''; updateDisplays(); renderPopup(); }
  function _prev()     { viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderPopup(); }
  function _next()     { viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderPopup(); }

  function updateDisplays() {
    const sd=document.getElementById('startDateDisplay');
    const sl=document.getElementById('startDateLabel');
    const ed=document.getElementById('endDateDisplay');
    const el=document.getElementById('endDateLabel');
    if (!sd) return;
    if (draftStart) { sl.textContent=formatDate(draftStart); sd.classList.remove('empty'); sd.classList.add('has-date'); }
    else            { sl.textContent='Select date'; sd.classList.add('empty'); sd.classList.remove('has-date'); }
    if (draftEnd)   { el.textContent=formatDate(draftEnd);   ed.classList.remove('empty'); ed.classList.add('has-date'); }
    else            { el.textContent='Select date'; ed.classList.add('empty'); ed.classList.remove('has-date'); }
  }

  function formatDate(str) {
    if (!str) return '';
    const [y,m,d] = str.split('-');
    return `${parseInt(d)} ${CONFIG.monthNames[parseInt(m)-1].slice(0,3)} ${y}`;
  }

  function reset() { draftStart=''; draftEnd=''; updateDisplays(); }

  return { open, close, _select, _clearEnd, _prev, _next,
           updateDisplays, reset, formatDate,
           getDraftStart, getDraftEnd };
})();

/* ============================================================
   MODULE 5: EventManager
   Draft dates are owned by DatePicker — retrieved via
   DatePicker.getDraftStart() / getDraftEnd(). No circular ref.
============================================================ */
const EventManager = (() => {
  let events = [];

  function addEvent() {
    const text      = document.getElementById('eventText').value.trim();
    const startDate = DatePicker.getDraftStart();
    const endDate   = DatePicker.getDraftEnd();
    const recurring = document.getElementById('eventRecurring').checked;

    if (!text) { Toast.show('Enter an event name.','error'); return; }
    if (!Security.isValidDate(startDate)) { Toast.show('Select a start date.','error'); return; }
    if (endDate && !Security.isValidDate(endDate)) { Toast.show('Invalid end date.','error'); return; }
    if (endDate && endDate < startDate) { Toast.show('End date must be after start.','error'); return; }
    if (text.length > CONFIG.maxEventLen) { Toast.show('Event name too long.','error'); return; }

    events.push({ id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, startDate, endDate:endDate||'', recurring });
    document.getElementById('eventText').value = '';
    document.getElementById('eventRecurring').checked = false;
    DatePicker.reset();
    UIRenderer.renderEventsList(); UIRenderer.renderAll();
    Toast.show('Event added.','success');
  }

  function removeEvent(id) { events=events.filter(e=>e.id!==id); UIRenderer.renderEventsList(); UIRenderer.renderAll(); }

  function getEventsForDay(year,month,day) {
    const pad = n=>String(n).padStart(2,'0');
    const ds  = `${year}-${pad(month+1)}-${pad(day)}`;
    return events.filter(ev=>{
      if (ev.recurring) {
        const [,sm,sd]=ev.startDate.split('-');
        if (!ev.endDate) return sm===pad(month+1)&&sd===pad(day);
        const [,em,ed]=ev.endDate.split('-');
        const cs=`${year}-${sm}-${sd}`, ce=`${year}-${em}-${ed}`;
        return ds>=cs&&ds<=ce;
      }
      return !ev.endDate?ev.startDate===ds:ds>=ev.startDate&&ds<=ev.endDate;
    });
  }

  function isRange(ev) { return !!ev.endDate; }
  function getAll()    { return events; }
  function setAll(arr) {
    events=(arr||[]).filter(e=>{try{Security.validateSchema(e,{id:'string',text:'string',startDate:'string',recurring:'boolean'});return Security.isValidDate(e.startDate);}catch{return false;}});
  }
  function clear(){ events=[]; UIRenderer.renderEventsList(); UIRenderer.renderAll(); Toast.show('Events cleared.','success'); }

  return {addEvent,removeEvent,getEventsForDay,isRange,getAll,setAll,clear};
})();

/* ============================================================
   MODULE 6: HolidayLoader
============================================================ */
const HolidayLoader = (() => {
  let holidays=[];
  const REGIONS=['england-and-wales','scotland','northern-ireland'];
  function import_(ev){
    const file=ev.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const raw=JSON.parse(e.target.result);
        let ex=Array.isArray(raw)?raw:[];
        if(!ex.length)for(const k of REGIONS)if(raw[k]?.events){ex=raw[k].events;break;}
        if(!ex.length)throw new Error('No events found.');
        const loaded=ex.filter(h=>h&&typeof h.title==='string'&&Security.isValidDate(h.date)).map(h=>({title:h.title.slice(0,80),date:h.date}));
        loaded.forEach(h=>{if(!holidays.some(x=>x.date===h.date&&x.title===h.title))holidays.push(h);});
        updateStatus();UIRenderer.renderAll();Toast.show(loaded.length+' holidays imported.','success');
      }catch(err){Toast.show('Holiday error: '+err.message,'error');}
      ev.target.value='';
    };
    reader.readAsText(file);
  }
  function setHolidays(arr){holidays=arr;updateStatus();}
  function getHolidaysForDay(year,month,day){const p=n=>String(n).padStart(2,'0');const d=`${year}-${p(month+1)}-${p(day)}`;return holidays.filter(h=>h.date===d);}
  function getAll(){return holidays;}
  function setAll(arr){holidays=(arr||[]).filter(h=>h&&typeof h.title==='string'&&Security.isValidDate(h.date));updateStatus();}
  function clear(){holidays=[];updateStatus();UIRenderer.renderAll();Toast.show('Holidays cleared.','success');}
  function updateStatus(){const el=document.getElementById('holidayStatus');if(el)el.textContent=holidays.length?holidays.length+' holidays loaded.':'No holidays loaded.';}
  return {import:import_,setHolidays,getHolidaysForDay,getAll,setAll,clear,updateStatus};
})();

/* ============================================================

const PhotoManager = (() => {
  let db=null;
  function init(){return new Promise((res,rej)=>{const req=indexedDB.open(CONFIG.dbName,CONFIG.dbVersion);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(CONFIG.dbStore))d.createObjectStore(CONFIG.dbStore);};req.onsuccess=e=>{db=e.target.result;res();};req.onerror=()=>rej(req.error);});}
  const put=(k,v)=>new Promise((res,rej)=>{const tx=db.transaction(CONFIG.dbStore,'readwrite');tx.objectStore(CONFIG.dbStore).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  const get=k=>new Promise(res=>{const tx=db.transaction(CONFIG.dbStore,'readonly');const r=tx.objectStore(CONFIG.dbStore).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});
  const del=k=>new Promise(res=>{const tx=db.transaction(CONFIG.dbStore,'readwrite');tx.objectStore(CONFIG.dbStore).delete(k);tx.oncomplete=res;});
  const clearAll=()=>new Promise(res=>{const tx=db.transaction(CONFIG.dbStore,'readwrite');tx.objectStore(CONFIG.dbStore).clear();tx.oncomplete=res;});
  const pK=(y,m,s)=>`photo_${y}_${m}_${s}`, zK=(y,m,s)=>`pz_${y}_${m}_${s}`;
  const savePhoto=(y,m,s,d)=>put(pK(y,m,s),d);
  const loadPhoto=(y,m,s)=>get(pK(y,m,s));
  const deletePhoto=(y,m,s)=>del(pK(y,m,s)).then(()=>del(zK(y,m,s)));
  const savePZ=(y,m,s,st)=>put(zK(y,m,s),st);
  const loadPZ=(y,m,s)=>get(zK(y,m,s));
  return {init,savePhoto,loadPhoto,deletePhoto,savePZ,loadPZ,clearAll};
})();

/* ============================================================
   MODULE 13: PanZoom
   computeCoverState — fills frame, no gaps (cover).
   computeFitState  — shows whole image (contain).
   Attach works on both sidebar thumbnails and preview pages.
============================================================ */
const PanZoom = (() => {

  /* Cover: scale so image fills the container completely.
     Image may be cropped but no empty space. This is the new default. */
  function computeCoverState(nw,nh,cw,ch){
    const scale=Math.max(cw/nw,ch/nh);
    return {x:(cw-nw*scale)/2, y:(ch-nh*scale)/2, scale};
  }

  /* Contain: whole image visible. Used by "Fit" button. */
  function computeFitState(nw,nh,cw,ch){
    const scale=Math.min(cw/nw,ch/nh);
    return {x:(cw-nw*scale)/2, y:(ch-nh*scale)/2, scale};
  }

  /* locked=true: only applies image transform, no drag/zoom interaction.
     Used for preview containers when pan is locked in sidebar. */
  function attach(container,img,savedState,onChange,locked=false){
    let state=null,dragging=false,startX=0,startY=0;
    function applyState(){if(!state)return;img.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;}
    function initState(){
      const cW=container.offsetWidth||container.getBoundingClientRect().width||260;
      const cH=container.offsetHeight||container.getBoundingClientRect().height||68;
      img.style.width=img.naturalWidth+'px';
      img.style.height=img.naturalHeight+'px';
      state=(savedState&&savedState._userSet)?{...savedState}:computeCoverState(img.naturalWidth,img.naturalHeight,cW,cH);
      applyState();
    }
    if(img.complete&&img.naturalWidth>0)initState();else img.onload=initState;

    /* Only wire up interaction events when NOT locked */
    if(!locked){
      container.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX-state.x;startY=e.clientY-state.y;container.style.cursor='grabbing';e.preventDefault();});
      window.addEventListener('mousemove',e=>{if(!dragging)return;state.x=e.clientX-startX;state.y=e.clientY-startY;applyState();});
      window.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;container.style.cursor='grab';state._userSet=true;onChange({...state});});
      container.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.min(10,Math.max(0.1,state.scale*(e.deltaY>0?0.9:1.1)));applyState();state._userSet=true;onChange({...state});},{passive:false});
      let ld=0;
      container.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;startX=e.touches[0].clientX-state.x;startY=e.touches[0].clientY-state.y;}if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);e.preventDefault();},{passive:false});
      container.addEventListener('touchmove',e=>{if(e.touches.length===1&&dragging){state.x=e.touches[0].clientX-startX;state.y=e.touches[0].clientY-startY;applyState();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);state.scale=Math.min(10,Math.max(0.1,state.scale*(d/ld)));ld=d;applyState();}e.preventDefault();},{passive:false});
      container.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;state._userSet=true;onChange({...state});});
    }

    function zoom(f){if(!state)return;state.scale=Math.min(10,Math.max(0.1,state.scale*f));applyState();state._userSet=true;onChange({...state});}
    function reset(){const cW=container.offsetWidth||260,cH=container.offsetHeight||68;state=computeFitState(img.naturalWidth,img.naturalHeight,cW,cH);state._userSet=false;applyState();onChange({...state});}
    function cover(){const cW=container.offsetWidth||260,cH=container.offsetHeight||68;state=computeCoverState(img.naturalWidth,img.naturalHeight,cW,cH);state._userSet=false;applyState();onChange({...state});}

    return {zoom,reset,cover};
  }

  return {attach,computeCoverState,computeFitState};
})();

  function importJSON(ev){

        bd.remove();
        try{
          Security.validateSchema(raw,{schemaVersion:'number',startMonth:'number',startYear:'number',monthCount:'number',font:'string',events:'array'});
          if(!Security.isValidYear(raw.startYear))throw new Error('Year out of range.');
          document.getElementById('startMonth').value=raw.startMonth;document.getElementById('startYear').value=raw.startYear;document.getElementById('monthCount').value=raw.monthCount;
          if(raw.showToday!==undefined)document.getElementById('showToday').checked=raw.showToday;
          FontManager.apply(raw.font||'georgia');
          if(raw.captions)App.setCaptions(raw.captions);if(raw.templates)App.setTemplates(raw.templates);if(raw.compactGrids)App.setCompactGrids(raw.compactGrids);
          EventManager.setAll(raw.events||[]);HolidayLoader.setAll(raw.holidays||[]);
          if(raw.branding)BrandingManager.setState(raw.branding);
          App.onRangeChange();UIRenderer.renderEventsList();MobileUI.syncToDrawer();
          Toast.show('Import successful.','success');
        }catch(err){Toast.show('Import failed: '+err.message,'error');}
      };
    };
    reader.readAsText(file);ev.target.value='';
  }
  return {exportJSON,importJSON};
})();

/* ============================================================
   MODULE 17: MobileUI
   Handles bottom drawer, preview scaling, mobile sync.
============================================================ */
const MobileUI = (() => {
  let drawerOpen = false;

  function isMobile(){ return window.innerWidth <= 768; }

  /* Scale .cal-page elements to fit the mobile screen width */
  function scalePages(){
    if (!isMobile()) {
      document.querySelectorAll('.cal-page').forEach(p=>{ p.style.transform=''; });
      return;
    }
    const available = window.innerWidth - 16; // 8px padding each side
    const scale = available / 794;
    document.querySelectorAll('.cal-page').forEach(p=>{
      p.style.transform = `scale(${scale})`;
      p.style.transformOrigin = 'top center';
      p.style.marginBottom = `${-(1123*(1-scale))}px`; // collapse whitespace below scaled page
    });
  }

  function toggleDrawer(){
    drawerOpen ? closeDrawer() : openDrawer();
  }

  function openDrawer(){
    drawerOpen = true;
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('drawerBackdrop');
    drawer.classList.add('open');
    backdrop.classList.add('open');
  }

  function closeDrawer(){
    drawerOpen = false;
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.remove('open');
  }

  /* Sync drawer controls → main toolbar → re-render */
  function syncFromDrawer(){
    const mm = document.getElementById('mStartMonth');
    const my = document.getElementById('mStartYear');
    const mc = document.getElementById('mMonthCount');
    if(!mm||!my||!mc) return;
    document.getElementById('startMonth').value   = mm.value;
    document.getElementById('startYear').value    = my.value;
    document.getElementById('monthCount').value   = mc.value;
    App.onRangeChange();
  }

  /* Sync main toolbar → drawer controls */
  function syncToDrawer(){
    const mm = document.getElementById('mStartMonth');
    const my = document.getElementById('mStartYear');
    const mc = document.getElementById('mMonthCount');
    if(!mm||!my||!mc) return;
    mm.value = document.getElementById('startMonth').value;
    my.value = document.getElementById('startYear').value;
    mc.value = document.getElementById('monthCount').value;
    updateMobileMonthList();
    updateMobileRangeLabel();
  }

  function updateMobileMonthList(){
    const list = document.getElementById('mobileMonthList');
    if (!list) return;
    const sm  = parseInt(document.getElementById('startMonth').value);
    const sy  = parseInt(document.getElementById('startYear').value);
    const cnt = parseInt(document.getElementById('monthCount').value);
    const range = CalendarEngine.buildRange(sy,sm,cnt);
    list.innerHTML = '';
    range.forEach((r,i)=>{
      const item = document.createElement('div');
      item.className = 'mobile-month-item'+(i===UIRenderer.getSelectedIdx()?' active':'');
      item.onclick = ()=>{ UIRenderer.setSelectedIdx(i); updateMobileMonthList(); UIRenderer.renderAll(); closeDrawer(); };
      const nm = document.createElement('span');
      nm.textContent = CONFIG.monthNames[r.month]+' '+r.year;
      const dot = document.createElement('span');
      dot.className = 'photo-dot';
      PhotoManager.loadPhoto(r.year,r.month,0).then(d=>{ if(d)dot.textContent='📷'; });
      item.appendChild(nm); item.appendChild(dot);
      list.appendChild(item);
    });
  }

  function updateMobileRangeLabel(){
    const el = document.getElementById('mRangeIndicator');
    if (!el) return;
    const sm  = parseInt(document.getElementById('startMonth').value);
    const sy  = parseInt(document.getElementById('startYear').value);
    const cnt = parseInt(document.getElementById('monthCount').value);
    const range = CalendarEngine.buildRange(sy,sm,cnt);
    el.textContent = CalendarEngine.rangeLabel(range);
  }

  /* Initialise mobile year dropdowns in drawer */
  function initDrawerYears(){
    const sel = document.getElementById('mStartYear');
    for(let y=CONFIG.yearMin;y<=CONFIG.yearMax;y++){
      const o=document.createElement('option');o.value=y;o.textContent=y;
      if(y===CONFIG.defaultYear)o.selected=true;sel.appendChild(o);
    }
  }

  /* Show/hide mobile-only elements based on viewport */
  function applyLayout(){
    const mobile = isMobile();
    // Mobile print button in header
    const mPrint = document.querySelector('.mobile-only');
    if(mPrint) mPrint.style.display = mobile ? 'block' : 'none';
  }

  window.addEventListener('resize', ()=>{ scalePages(); applyLayout(); syncToDrawer(); });

  return {isMobile,scalePages,toggleDrawer,openDrawer,closeDrawer,syncFromDrawer,syncToDrawer,updateMobileMonthList,updateMobileRangeLabel,initDrawerYears,applyLayout};
})();

/* ============================================================
   MODULE 18: UIRenderer
============================================================ */
const UIRenderer = (() => {
  let selectedIdx = 0;

  function getSelectedIdx(){ return selectedIdx; }
  function setSelectedIdx(i){ selectedIdx=i; }

  function initYearSelect(){
    const sel=document.getElementById('startYear');
    for(let y=CONFIG.yearMin;y<=CONFIG.yearMax;y++){const o=document.createElement('option');o.value=y;o.textContent=y;if(y===CONFIG.defaultYear)o.selected=true;sel.appendChild(o);}
  }

  function renderMonthList(range){
    const list=document.getElementById('monthList');list.innerHTML='';
    range.forEach((r,i)=>{
      const item=document.createElement('div');item.className='month-item'+(i===selectedIdx?' active':'');
      item.onclick=()=>{selectedIdx=i;renderMonthList(range);renderMonthEditor(r,i);};
      const nm=document.createElement('span');nm.textContent=`${CONFIG.monthNames[r.month]} ${r.year}`;
      const dot=document.createElement('span');dot.className='photo-dot';PhotoManager.loadPhoto(r.year,r.month,0).then(d=>{if(d)dot.textContent='📷';});
      item.appendChild(nm);item.appendChild(dot);list.appendChild(item);
    });
    MobileUI.updateMobileMonthList();
  }

  function renderMonthEditor(r,idx){
    document.getElementById('editorTitle').textContent=`${CONFIG.monthNames[r.month]} ${r.year}`;
    renderTemplateGrid(r,idx);
    document.getElementById('captionInput').value=App.getCaptions()[idx]||'';
    // Sync compact-grid checkbox to this month's setting (default: checked/on)
    const cg=document.getElementById('compactGrid');
    if(cg) cg.checked = App.isCompact(idx);
  }

  function renderTemplateGrid(r,idx){
    const grid=document.getElementById('templateGrid');grid.innerHTML='';
    const cur=App.getTemplates()[idx]||CONFIG.templates[0].id;
    CONFIG.templates.forEach(tpl=>{
      const opt=document.createElement('div');opt.className='template-option'+(tpl.id===cur?' selected':'');
      opt.onclick=()=>{App.setTemplate(idx,tpl.id);renderTemplateGrid(r,idx);renderPhotoSlots(r,idx);renderAll();};
      const ic=document.createElement('div');ic.className='t-icon';ic.textContent=tpl.icon;
      const lb=document.createElement('div');lb.className='t-label';lb.textContent=tpl.label;
      opt.appendChild(ic);opt.appendChild(lb);grid.appendChild(opt);
    });
    renderPhotoSlots(r,idx);
  }

  function renderPhotoSlots(r,idx){
    const container=document.getElementById('photoSlots');container.innerHTML='';
    const tplId=App.getTemplates()[idx]||CONFIG.templates[0].id;
    const tpl=CONFIG.templates.find(t=>t.id===tplId)||CONFIG.templates[0];
    const labels=['Main photo','Side 1','Side 2','Side 3'];
    for(let s=0;s<tpl.slotCount;s++){
      const slotType=s===0?'main':'side';
      const slotDiv=document.createElement('div');slotDiv.className='photo-slot';
      const lbl=document.createElement('div');lbl.style.cssText='font-size:0.63rem;color:var(--text-muted);margin-bottom:3px;';lbl.textContent=labels[s];slotDiv.appendChild(lbl);
      const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';
      fileInput.onchange=async ev=>{
        const file=ev.target.files[0];if(!file)return;
        if(!file.type.startsWith('image/')){Toast.show('Only image files accepted.','error');return;}
        const reader=new FileReader();
        reader.onload=async re=>{await PhotoManager.savePhoto(r.year,r.month,s,re.target.result);await PhotoManager.savePZ(r.year,r.month,s,{x:0,y:0,scale:1,_userSet:false});renderPhotoSlots(r,idx);renderAll();Toast.show('Photo saved.','success');};
        reader.readAsDataURL(file);
      };
      slotDiv.appendChild(fileInput);
      PhotoManager.loadPhoto(r.year,r.month,s).then(async dataURL=>{
        if(dataURL){
          slotDiv.classList.add('has-image');
          const tw=document.createElement('div');tw.className='thumb-wrap';
          const ti=document.createElement('img');ti.src=dataURL;ti.alt=labels[s];tw.appendChild(ti);slotDiv.appendChild(tw);
          const savedPZ=await PhotoManager.loadPZ(r.year,r.month,s);
          const pzCtrl=PanZoom.attach(tw,ti,savedPZ,async st=>{await PhotoManager.savePZ(r.year,r.month,s,st);renderAll();});
          const ctrl=document.createElement('div');ctrl.className='slot-controls';
          const zIn=document.createElement('button');zIn.textContent='+';zIn.onclick=e=>{e.stopPropagation();pzCtrl.zoom(1.15);};
          const zOut=document.createElement('button');zOut.textContent='−';zOut.onclick=e=>{e.stopPropagation();pzCtrl.zoom(0.87);};
          const fit=document.createElement('button');fit.textContent='Fit';fit.title='Show whole image';fit.onclick=e=>{e.stopPropagation();pzCtrl.reset();};
          const cov=document.createElement('button');cov.textContent='Fill';cov.title='Fill frame';cov.onclick=e=>{e.stopPropagation();pzCtrl.cover();};
          const del=document.createElement('button');del.textContent='✕';del.className='danger';del.onclick=async e=>{e.stopPropagation();await PhotoManager.deletePhoto(r.year,r.month,s);renderPhotoSlots(r,idx);renderAll();};
          ctrl.appendChild(zIn);ctrl.appendChild(zOut);ctrl.appendChild(fit);ctrl.appendChild(cov);ctrl.appendChild(del);slotDiv.appendChild(ctrl);
          /* Pan-lock toggle — controls whether preview page responds to drag */
          const lockBtn=document.createElement('button');
          lockBtn.className='pan-lock-btn';
          const lockKey=`panlock_${r.year}_${r.month}_${s}`;
          const isUnlocked=sessionStorage.getItem(lockKey)==='1';
          lockBtn.textContent=isUnlocked?'🔓 Pan enabled':'🔒 Pan locked';
          if(isUnlocked)lockBtn.classList.add('unlocked');
          lockBtn.onclick=e=>{
            e.stopPropagation();
            const nowUnlocked=sessionStorage.getItem(lockKey)!=='1';
            sessionStorage.setItem(lockKey,nowUnlocked?'1':'0');
            lockBtn.textContent=nowUnlocked?'🔓 Pan enabled':'🔒 Pan locked';
            nowUnlocked?lockBtn.classList.add('unlocked'):lockBtn.classList.remove('unlocked');
            // Toggle pz-unlocked class on the matching preview container
            const previewPZ=document.querySelectorAll(`.cal-photo-area .pz-container`);
            renderAll(); // re-render to apply lock state
          };
          slotDiv.appendChild(lockBtn);
          const qw=document.createElement('div');qw.className='quality-warn';slotDiv.appendChild(qw);
          QualityChecker.check(dataURL,slotType).then(res=>{
            if(res==='warn'){qw.className='quality-warn warn-amber';qw.textContent='⚠ Borderline resolution.';}
            else if(res==='low'){qw.className='quality-warn warn-red';qw.textContent='⛔ Too low for photo-paper print.';}
          });
        }else{
          slotDiv.classList.add('clickable');
          const ph=document.createElement('div');ph.style.cssText='padding:10px 0;text-align:center;font-size:0.68rem;color:var(--text-muted);';ph.textContent='+ Click to upload '+labels[s].toLowerCase();
          slotDiv.appendChild(ph);slotDiv.onclick=()=>fileInput.click();
        }
      });
      container.appendChild(slotDiv);
    }
  }

  function renderEventsList(){
    const list=document.getElementById('eventsList');list.innerHTML='';
    const evs=EventManager.getAll();
    if(!evs.length){const e=document.createElement('div');e.className='text-muted';e.textContent='No events yet.';list.appendChild(e);return;}
    evs.forEach(ev=>{
      const item=document.createElement('div');item.className='event-item';
      const info=document.createElement('div');info.className='ev-info';
      const ds=document.createElement('div');ds.className='ev-date';
      ds.textContent=(ev.endDate?DatePicker.formatDate(ev.startDate)+' → '+DatePicker.formatDate(ev.endDate):DatePicker.formatDate(ev.startDate))+(ev.recurring?' (annual)':'');
      const ts=document.createElement('div');ts.textContent=ev.text;
      info.appendChild(ds);info.appendChild(ts);
      const del=document.createElement('button');del.textContent='✕';del.className='danger';del.onclick=()=>EventManager.removeEvent(ev.id);
      item.appendChild(info);item.appendChild(del);list.appendChild(item);
    });
  }

  async function renderAll(){
    const sm=parseInt(document.getElementById('startMonth').value);
    const sy=parseInt(document.getElementById('startYear').value);
    const cnt=parseInt(document.getElementById('monthCount').value);
    const st=document.getElementById('showToday').checked;
    const range=CalendarEngine.buildRange(sy,sm,cnt);
    document.getElementById('rangeIndicator').textContent=CalendarEngine.rangeLabel(range);
    renderMonthList(range);
    if(range[selectedIdx])renderMonthEditor(range[selectedIdx],selectedIdx);
    const preview=document.getElementById('previewArea');preview.innerHTML='';
    for(let i=0;i<range.length;i++){
      const wrapper=document.createElement('div');wrapper.className='cal-page-wrapper';
      const page=await buildPage(range[i].year,range[i].month,i,st,range[i]);
      wrapper.appendChild(page);preview.appendChild(wrapper);
    }
    MobileUI.syncToDrawer();
    MobileUI.updateMobileRangeLabel();
    // Apply mobile scaling after DOM is updated
    setTimeout(()=>MobileUI.scalePages(),50);
  }

  async function buildPage(year,month,idx,showToday,rangeItem){
    const page=document.createElement('div');page.className='cal-page';
    const tplId=App.getTemplates()[idx]||CONFIG.templates[0].id;
    const tpl=CONFIG.templates.find(t=>t.id===tplId)||CONFIG.templates[0];
    const fs=FontManager.getStack(FontManager.getCurrent());

    /* Photo area */
    const photoArea=document.createElement('div');photoArea.className=`cal-photo-area tmpl-${tplId}`;

    for(let s=0;s<tpl.slotCount;s++){
      const dataURL=await PhotoManager.loadPhoto(year,month,s);
      const pzState=await PhotoManager.loadPZ(year,month,s);
      const pzDiv=document.createElement('div');pzDiv.className='pz-container';

      if(dataURL){
        const img=document.createElement('img');img.src=dataURL;img.alt='';img.style.imageRendering='high-quality';img.style.maxWidth='none';

        img.onload=()=>{
          img.style.width=img.naturalWidth+'px';img.style.height=img.naturalHeight+'px';
          // Use cover (fill) as default. Restore saved state if user has adjusted.
          if(pzState&&pzState._userSet){
            img.style.transform=`translate(${pzState.x}px,${pzState.y}px) scale(${pzState.scale})`;
          }else{
            const cW=pzDiv.offsetWidth||(s===0?529:265);
            const cH=pzDiv.offsetHeight||(s===0?480:160);
            const cover=PanZoom.computeCoverState(img.naturalWidth,img.naturalHeight,cW,cH);
            img.style.transform=`translate(${cover.x}px,${cover.y}px) scale(${cover.scale})`;
          }
        };

        /* Attach pan/zoom to preview.
           Lock state stored in sessionStorage per slot.
           Unlocked only when user explicitly enables via sidebar toggle. */
        const lockKey=`panlock_${year}_${month}_${s}`;
        const isUnlocked=sessionStorage.getItem(lockKey)==='1';
        if(isUnlocked) pzDiv.classList.add('pz-unlocked');

        const previewPZ=PanZoom.attach(pzDiv,img,pzState,async st=>{
          await PhotoManager.savePZ(year,month,s,st);
        }, /* locked= */ !isUnlocked);

        pzDiv.appendChild(img);
      }else{
        /* Clickable placeholder */
        const ph=document.createElement('div');ph.className='photo-placeholder';
        const ic=document.createElement('div');ic.className='ph-icon';ic.textContent='🖼';
        const tx=document.createElement('span');tx.textContent=s===0?'Click to upload photo':`Click to upload photo ${s+1}`;
        const ht=document.createElement('span');ht.className='ph-hint';ht.textContent='or use the sidebar';
        ph.appendChild(ic);ph.appendChild(tx);ph.appendChild(ht);
        const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style.display='none';
        fi.onchange=async ev=>{
          const file=ev.target.files[0];if(!file)return;
          if(!file.type.startsWith('image/')){Toast.show('Only image files accepted.','error');return;}
          const reader=new FileReader();
          reader.onload=async re=>{await PhotoManager.savePhoto(rangeItem.year,rangeItem.month,s,re.target.result);await PhotoManager.savePZ(rangeItem.year,rangeItem.month,s,{x:0,y:0,scale:1,_userSet:false});renderAll();Toast.show('Photo saved.','success');};
          reader.readAsDataURL(file);
        };
        ph.appendChild(fi);ph.onclick=()=>fi.click();pzDiv.appendChild(ph);
      }
      photoArea.appendChild(pzDiv);
    }
    page.appendChild(photoArea);

    /* Caption */
    const cap=App.getCaptions()[idx]||'';
    const capBar=document.createElement('div');capBar.className='cal-caption';if(cap)capBar.textContent=cap;
    page.appendChild(capBar);

    /* Grid */
    const gridArea=document.createElement('div');gridArea.className='cal-grid-area';gridArea.style.fontFamily=fs;
    const hdr=document.createElement('div');hdr.className='cal-month-header';
    const mn=document.createElement('div');mn.className='cal-month-name';mn.textContent=CONFIG.monthNames[month];
    const yl=document.createElement('div');yl.className='cal-year-label';yl.textContent=year;
    hdr.appendChild(mn);hdr.appendChild(yl);gridArea.appendChild(hdr);
    const dowRow=document.createElement('div');dowRow.className='cal-dow-row';
    CONFIG.daysOfWeek.forEach(d=>{const c=document.createElement('div');c.className='cal-dow-cell';c.textContent=d;dowRow.appendChild(c);});
    gridArea.appendChild(dowRow);
    const grid=document.createElement('div');grid.className='cal-dates-grid';
    const cells=CalendarEngine.getMonthGrid(year,month);
    const todayDay=showToday?CalendarEngine.getTodayDay(year,month):null;

    /* Detect how many rows are actually needed.
       Each row = 7 cells. Find the last row that has any non-zero day. */
    const compact=App.isCompact(idx);
    let activeRows=0;
    for(let row=0;row<6;row++){
      const rowCells=cells.slice(row*7,(row+1)*7);
      if(rowCells.some(d=>d>0)) activeRows=row+1;
    }
    /* Total rows always 6 in grid — but we may hide trailing empty ones */
    const rowsToShow=compact?activeRows:6;

    /* Set explicit grid-template-rows so hidden rows collapse to zero */
    grid.style.gridTemplateRows=`repeat(${rowsToShow},1fr)`;

    cells.forEach((day,cellIdx)=>{
      const rowIdx=Math.floor(cellIdx/7);
      /* Skip cells in rows beyond what we're showing */
      if(rowIdx>=rowsToShow) return;
      const cell=document.createElement('div');cell.className='cal-date-cell'+(day===0?' empty':'')+(day===todayDay?' today':'');
      if(day>0){
        const n=document.createElement('span');n.className='cal-date-num';n.textContent=day;cell.appendChild(n);
        HolidayLoader.getHolidaysForDay(year,month,day).forEach(h=>{const e=document.createElement('div');e.className='cal-event holiday';e.textContent=h.title;e.title=h.title;cell.appendChild(e);});
        EventManager.getEventsForDay(year,month,day).forEach(ev=>{const e=document.createElement('div');e.className='cal-event '+(EventManager.isRange(ev)?'special-range':'special');e.textContent=ev.text;e.title=ev.text;cell.appendChild(e);});
      }
      grid.appendChild(cell);
    });
    gridArea.appendChild(grid);page.appendChild(gridArea);
    return page;
  }

  /* Lightweight: refresh just one sidebar thumbnail after preview pan */
  function renderPhotoSlotThumb(year,month,slot){
    const thumbWrap=document.querySelector(`#photoSlots .thumb-wrap:nth-of-type(${slot+1})`);
    // Silently skip if sidebar not in view — full re-render not needed
  }

  return {initYearSelect,renderMonthList,renderMonthEditor,renderEventsList,renderAll,getSelectedIdx,setSelectedIdx};
})();

/* ============================================================
   MODULE 19: App
============================================================ */
const App = (() => {
  let captions={}, templates={}, compactGrids={};

  const getCaptions    = ()    => captions;
  const getTemplates   = ()    => templates;
  const getCompactGrids= ()    => compactGrids;
  const setCaptions    = c     => { captions=c||{}; };
  const setTemplates   = t     => { templates=t||{}; };
  const setCompactGrids= c     => { compactGrids=c||{}; };
  const setTemplate    = (i,t) => { templates[i]=t; };

  function onCaptionChange(v){
    captions[UIRenderer.getSelectedIdx()]=v.slice(0,CONFIG.maxCaptionLen);
    UIRenderer.renderAll();
  }

  /* Called when the compact-grid checkbox changes for the selected month */
  function onCompactChange(checked){
    compactGrids[UIRenderer.getSelectedIdx()] = checked;
    UIRenderer.renderAll();
  }

  /* Returns whether compact mode is on for a given month index.
     Default is true (compact on). */
  function isCompact(idx){
    return compactGrids[idx] !== false; // default true
  }

  function onRangeChange(){ UIRenderer.renderAll(); MobileUI.syncToDrawer(); }
  const exportJSON        = ()  => ImportExport.exportJSON();
  const triggerImportJSON = ()  => document.getElementById('importJSONInput').click();
  const importJSON        = e   => ImportExport.importJSON(e);
  const loadHolidays      = ()  => document.getElementById('importHolidaysInput').click();
  async function clearAllPhotos(){ if(!confirm('Remove all stored photos?'))return; await PhotoManager.clearAll(); UIRenderer.renderAll(); Toast.show('Photos cleared.','success'); }
  function clearAllEvents(){ if(!confirm('Remove all events?'))return; EventManager.clear(); }

  async function init(){
    try{await PhotoManager.init();}catch{Toast.show('IndexedDB unavailable — photos will not persist.','warn');}
    UIRenderer.initYearSelect();
    MobileUI.initDrawerYears();
    FontManager.init();
    HolidayLoader.updateStatus();
    MobileUI.applyLayout();
    document.getElementById('startMonth').value=CONFIG.defaultMonth;
    document.getElementById('startYear').value=CONFIG.defaultYear;
    document.getElementById('monthCount').value=CONFIG.defaultCount;
    await UIRenderer.renderAll();
    UIRenderer.renderEventsList();
    MobileUI.syncToDrawer();
  }

  return {
    getCaptions,getTemplates,getCompactGrids,isCompact,
    setCaptions,setTemplates,setCompactGrids,
    setTemplate,onCaptionChange,onCompactChange,onRangeChange,
    exportJSON,triggerImportJSON,importJSON,loadHolidays,
    clearAllPhotos,clearAllEvents,init
  };
})();

/* Boot */
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
